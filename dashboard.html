<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Internet App</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101214;
  --panel: #1b2024;
  --panel-soft: #22272d;
  --line: #343b42;
  --text: #f5f7f8;
  --muted: #aeb8bf;
  --accent: #2f9e8f;
  --accent-strong: #37b6a5;
  --warn: #e7b654;
  --danger: #e86f6f;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 18px;
}

header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 14px;
}

h1 {
  font-size: clamp(1.35rem, 3vw, 2rem);
  margin: 0;
  letter-spacing: 0;
}

#status {
  color: var(--muted);
  font-size: 0.88rem;
  text-align: right;
}

#controls {
  display: grid;
  gap: 10px;
  margin-bottom: 14px;
}

.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

input {
  min-width: min(100%, 280px);
  flex: 1 1 220px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  outline: none;
}

input:focus {
  border-color: var(--accent-strong);
}

select.category-select {
  justify-self: start;
  max-width: 100%;
  min-height: 30px;
  padding: 3px 28px 3px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 0.74rem;
  cursor: pointer;
}

select.category-select:hover,
select.category-select:focus {
  border-color: var(--accent);
  color: var(--text);
}

#databaseStatus {
  flex: 1 1 220px;
  color: var(--muted);
  font-size: 0.84rem;
}

button {
  min-height: 36px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  border-color: var(--accent);
}

button.active {
  background: var(--accent);
  border-color: var(--accent-strong);
  color: #061513;
  font-weight: 700;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

.card {
  min-height: 168px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 8px;
  position: relative;
  display: grid;
  gap: 8px;
  align-content: start;
}

.card:hover {
  border-color: var(--accent);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 64px;
}

.card img {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
}

.index {
  color: var(--muted);
  font-size: 0.72rem;
}

.card-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 2px;
}

.star,
.delete {
  width: 28px;
  height: 28px;
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
}

.star { color: var(--warn); }

.delete {
  color: var(--muted);
  font-size: 1rem;
}

.delete:hover {
  color: var(--danger);
}

.link {
  color: var(--text);
  text-decoration: none;
  font-size: 0.95rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.link:hover {
  color: var(--accent-strong);
}

.category {
  justify-self: start;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 0.74rem;
}

.description {
  margin: 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.38;
}

.empty {
  color: var(--muted);
  padding: 20px 0;
}

@media (max-width: 640px) {
  body { padding: 12px; }
  header { display: block; }
  #status { text-align: left; margin-top: 6px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
}

/* Glassmorphism Styles */
.glassmorphic {
  background: rgba(27, 32, 36, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.4);
}

/* Auth Screen Container */
.auth-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at center, #1b2024 0%, #101214 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  padding: 20px;
  overflow-y: auto;
}

.auth-card {
  width: 100%;
  max-width: 360px;
  background: rgba(27, 32, 36, 0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 0.4s ease-out;
}

.auth-header {
  text-align: center;
  margin-bottom: 20px;
  width: 100%;
}

.lock-icon {
  color: var(--accent);
  margin-bottom: 12px;
  filter: drop-shadow(0 0 10px rgba(47, 158, 143, 0.3));
  transition: transform 0.3s ease;
}

.lock-icon:hover {
  transform: scale(1.1);
}

.auth-card h2 {
  font-size: 1.4rem;
  margin: 0 0 6px 0;
  color: var(--text);
  font-weight: 600;
}

.auth-subtitle {
  color: var(--muted);
  font-size: 0.85rem;
  margin: 0;
  line-height: 1.35;
}

.passcode-display {
  display: flex;
  align-items: center;
  background: rgba(16, 18, 20, 0.6);
  border: 1px solid var(--line);
  border-radius: 12px;
  width: 100%;
  padding: 2px 8px;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}

.passcode-display:focus-within {
  border-color: var(--accent-strong);
}

.passcode-display input {
  border: none;
  background: transparent;
  width: 100%;
  padding: 10px 4px;
  font-size: 1.4rem;
  letter-spacing: 4px;
  text-align: center;
  color: var(--text);
  outline: none;
  min-width: 0;
  flex: 1;
}

.toggle-visibility {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  font-size: 1.1rem;
  transition: color 0.2s;
}

.toggle-visibility:hover {
  color: var(--text);
}

.auth-error {
  color: var(--danger);
  font-size: 0.82rem;
  margin-bottom: 12px;
  min-height: 18px;
  text-align: center;
  width: 100%;
  font-weight: bold;
}

/* Numeric Keypad */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  margin-bottom: 20px;
}

.key-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 50%;
  aspect-ratio: 1;
  width: 60px;
  height: 60px;
  margin: 0 auto;
  font-size: 1.4rem;
  font-weight: 500;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

.key-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--accent);
  color: var(--accent-strong);
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(47, 158, 143, 0.25);
}

.key-btn:active {
  background: var(--accent);
  color: #061513;
  transform: scale(0.95);
  box-shadow: none;
}

.action-key {
  font-size: 1rem;
  background: rgba(255, 255, 255, 0.01);
  color: var(--muted);
}

.action-key:hover {
  color: var(--text);
  border-color: var(--line);
  box-shadow: none;
}

.remember-me-container {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-bottom: 18px;
  font-size: 0.8rem;
  color: var(--muted);
}

.remember-me-container label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.remember-me-container input[type="checkbox"] {
  width: auto;
  min-width: auto;
  flex: none;
  cursor: pointer;
  margin: 0;
}

.auth-submit-btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: var(--accent);
  border: 1px solid var(--accent-strong);
  color: #061513;
  font-size: 0.95rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}

.auth-submit-btn:hover {
  background: var(--accent-strong);
  box-shadow: 0 0 12px rgba(55, 182, 165, 0.35);
  transform: translateY(-1px);
}

.auth-submit-btn:active {
  transform: translateY(1px);
}

/* Modals */
.modal {
  display: none;
  position: fixed;
  z-index: 10050;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  padding: 24px;
  position: relative;
  animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
}

.close-modal {
  position: absolute;
  right: 18px;
  top: 12px;
  color: var(--muted);
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  transition: color 0.2s;
}

.close-modal:hover {
  color: var(--text);
}

.modal h3 {
  margin: 0 0 18px 0;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-group label {
  font-size: 0.8rem;
  color: var(--muted);
}

.form-group input {
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  outline: none;
  width: 100%;
}

.form-group input:focus {
  border-color: var(--accent-strong);
}

.error-msg {
  color: var(--danger);
  font-size: 0.8rem;
  margin-bottom: 10px;
  font-weight: bold;
}

.success-msg {
  color: var(--accent-strong);
  font-size: 0.8rem;
  margin-bottom: 10px;
  font-weight: bold;
}

.modal-submit-btn {
  background: var(--accent);
  border-color: var(--accent-strong);
  color: #061513;
  font-weight: bold;
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  margin-top: 6px;
  cursor: pointer;
}

.modal-submit-btn:hover {
  background: var(--accent-strong);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes modalSlide {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.shake {
  animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
}

@keyframes shake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
  40%, 60% { transform: translate3d(3px, 0, 0); }
}
</style>
</head>
<body>

<!-- Lock/Setup Screen -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <!-- Animated SVG Lock icon -->
      <svg id="lock-icon" class="lock-icon" viewBox="0 0 24 24" width="48" height="48">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/>
      </svg>
      <h2 id="auth-title">Safe Internet App Locked</h2>
      <p id="auth-subtitle" class="auth-subtitle">Enter passcode to access websites</p>
    </div>

    <!-- Passcode Display (dots/stars) -->
    <div class="passcode-display">
      <input type="password" id="passcode-input" maxlength="12" readonly placeholder="••••">
      <button type="button" id="toggle-visibility" class="toggle-visibility" title="Show/Hide">👁️</button>
    </div>

    <!-- Confirmation field for setup mode -->
    <div id="confirm-passcode-group" class="passcode-display" style="display: none;">
      <input type="password" id="confirm-passcode-input" maxlength="12" readonly placeholder="Confirm ••••">
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Keypad -->
    <div class="keypad">
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" class="key-btn action-key" id="key-clear" title="Clear">C</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn action-key" id="key-backspace" title="Delete">⌫</button>
    </div>

    <div class="remember-me-container" id="remember-me-container">
      <label>
        <input type="checkbox" id="remember-me-checkbox" checked>
        Keep me logged in on this device
      </label>
    </div>

    <button type="button" id="auth-submit-btn" class="auth-submit-btn">Unlock</button>
  </div>
</div>

<!-- Change Passcode Modal -->
<div id="security-modal" class="modal">
  <div class="modal-content glassmorphic">
    <span class="close-modal" id="closeSecurityModal">&times;</span>
    <h3>Security Settings</h3>
    <form id="change-passcode-form">
      <div class="form-group">
        <label for="current-passcode">Current Passcode</label>
        <input type="password" id="current-passcode" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="new-passcode">New Passcode (min 4 characters)</label>
        <input type="password" id="new-passcode" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm-new-passcode">Confirm New Passcode</label>
        <input type="password" id="confirm-new-passcode" required autocomplete="new-password">
      </div>
      <div id="change-error" class="error-msg"></div>
      <div id="change-success" class="success-msg"></div>
      <button type="submit" class="modal-submit-btn">Update Passcode</button>
    </form>
  </div>
</div>

<!-- Main App Container (Hidden until authenticated) -->
<div id="app-container" style="display: none;">

<header>
  <h1>Safe Internet App</h1>
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
    <button id="lockBtn" type="button" style="padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.88rem;">
      🔒 Lock Session
    </button>
    <div id="status">Loading URLs from MongoDB...</div>
  </div>
</header>

<div id="controls">
  <div class="control-row">
    <input id="search" placeholder="Search websites, descriptions, or types..." autocomplete="off">
    <button id="focusBtn" type="button">Focus</button>
    <button id="exportBtn" type="button">Export JSON</button>
    <button id="exportCsvBtn" type="button">Export CSV</button>
    <button id="importBtn" type="button">Import JSON/CSV</button>
    <button id="securityBtn" type="button">Security Settings</button>
    <input id="importFile" class="visually-hidden" type="file" accept=".json,.csv,application/json,text/csv">
  </div>
  <div class="control-row">
    <input id="siteUrl" placeholder="Add website URL..." autocomplete="off" inputmode="url">
    <input id="siteName" placeholder="Website name..." autocomplete="off">
    <input id="siteDescription" placeholder="Website description..." autocomplete="off">
    <button id="addSiteBtn" type="button">Add Website</button>
    <div id="databaseStatus"></div>
  </div>
  <div class="control-row" id="categoryButtons"></div>
</div>

<div class="grid" id="grid"></div>
</div> <!-- End #app-container -->

<script src="urls.js"></script>
<script>
const CATEGORIES = [
  { id: 'all', label: 'All' },
  { id: 'search', label: 'Search' },
  { id: 'research', label: 'Research' },
  { id: 'reference', label: 'Reference' },
  { id: 'learning', label: 'Learning' },
  { id: 'news', label: 'News' },
  { id: 'reading', label: 'Reading' },
  { id: 'coding', label: 'Coding' },
  { id: 'tools', label: 'Tools' },
  { id: 'technology', label: 'Technology' },
  { id: 'creative', label: 'Creative' },
  { id: 'games', label: 'Games' },
  { id: 'mental-health', label: 'Mental Health' },
  { id: 'health', label: 'Health' },
  { id: 'government', label: 'Government' },
  { id: 'shopping', label: 'Shopping' },
  { id: 'finance', label: 'Finance' },
  { id: 'travel', label: 'Travel' },
  { id: 'business', label: 'Business' },
  { id: 'fav', label: 'Favorites' }
];

const EDITABLE_CATEGORIES = CATEGORIES.filter(category => !['all', 'fav'].includes(category.id));
const HOST_CATEGORIES = {};

let urlItems = [];
let current = 'all';
let focusMode = false;
let databaseConnected = false;

function getAuthHeaders(customHeaders = {}) {
  const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
  const headers = { ...customHeaders };
  if (token) {
    headers['Authorization'] = `Bearer ${token}`;
  }
  return headers;
}

function handleUnauthorized() {
  localStorage.removeItem('auth_token');
  sessionStorage.removeItem('auth_token');
  document.getElementById('app-container').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  checkAuthStatus();
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function loadDatabaseStatus() {
  const response = await fetch('/api/status', { headers: getAuthHeaders() });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

async function waitForMongoConnection(options = {}) {
  const retries = options.retries ?? 15;
  const delayMs = options.delayMs ?? 1000;
  let lastStatus = null;

  for (let attempt = 0; attempt <= retries; attempt += 1) {
    try {
      lastStatus = await loadDatabaseStatus();
      databaseConnected = lastStatus.status === 'connected';

      if (databaseConnected) {
        document.getElementById('status').textContent = 'MongoDB connected.';
        return lastStatus;
      }

      document.getElementById('status').textContent = lastStatus.status === 'connecting'
        ? 'Connecting to MongoDB...'
        : 'MongoDB connection failed.';
      setDatabaseStatus(lastStatus.message || 'MongoDB is not accessible yet.');
    } catch (error) {
      databaseConnected = false;
      lastStatus = { status: 'disconnected', message: error.message };
      document.getElementById('status').textContent = 'MongoDB connection failed.';
      setDatabaseStatus(`Could not check MongoDB status: ${error.message}`);
    }

    if (attempt < retries) await sleep(delayMs);
  }

  return lastStatus || { status: 'disconnected', message: 'MongoDB is not connected.' };
}

async function ensureMongoConnection() {
  if (databaseConnected) return true;

  const status = await waitForMongoConnection({ retries: 5, delayMs: 1000 });
  if (status.status === 'connected') return true;

  setDatabaseStatus(status.message || 'MongoDB is not connected. Try again after it connects.');
  return false;
}

async function loadWebsitesFromDatabase() {
  try {
    const response = await fetch('/api/websites', { headers: getAuthHeaders() });
    if (response.status === 401) {
      handleUnauthorized();
      return [];
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } catch (error) {
    console.warn('Failed to load websites from MongoDB:', error);
    return [];
  }
}

async function saveWebsiteToDatabase(item) {
  try {
    const response = await fetch('/api/websites', {
      method: 'POST',
      headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        url: item.url,
        name: item.name,
        category: item.category,
        description: item.description,
        isFavorite: item.isFavorite
      })
    });
    if (response.status === 401) {
      handleUnauthorized();
      throw new Error('Unauthorized');
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } catch (error) {
    console.error('Failed to save website to MongoDB:', error);
    throw error;
  }
}

async function deleteWebsiteFromDatabase(id) {
  try {
    const response = await fetch(`/api/websites/${id}`, {
      method: 'DELETE',
      headers: getAuthHeaders()
    });
    if (response.status === 401) {
      handleUnauthorized();
      throw new Error('Unauthorized');
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } catch (error) {
    console.error('Failed to delete website from MongoDB:', error);
    throw error;
  }
}

async function researchWebsiteMetadata(url) {
  const response = await fetch('/api/websites/research', {
    method: 'POST',
    headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ url })
  });
  if (response.status === 401) {
    handleUnauthorized();
    throw new Error('Unauthorized');
  }
  const body = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(body.error || `HTTP ${response.status}`);
  }

  return body;
}

function cleanUrl(raw) {
  return String(raw || '').trim().replace(/\/$/, '');
}

function normalizeInputUrl(raw) {
  const value = String(raw || '').trim();
  if (!value) return '';
  const withProtocol = /^https?:\/\//i.test(value) ? value : `https://${value}`;

  try {
    const parsed = new URL(withProtocol);
    parsed.hash = '';
    return cleanUrl(parsed.href);
  } catch {
    return '';
  }
}

function cleanText(raw) {
  return String(raw || '').trim().replace(/\s+/g, ' ');
}

function stripHtml(raw) {
  return cleanText(String(raw || '')
    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' '));
}

function shortenText(raw, max = 150) {
  const text = cleanText(raw);
  if (text.length <= max) return text;
  return `${text.slice(0, max - 1).replace(/\s+\S*$/, '')}.`;
}

function normalizeCategory(value) {
  const id = String(value || '')
    .trim()
    .toLowerCase()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');

  return CATEGORIES.some(category => category.id === id) ? id : '';
}

function getUrlParts(url) {
  try {
    const parsed = new URL(url);
    return {
      host: parsed.hostname.toLowerCase().replace(/^www\./, ''),
      path: parsed.pathname.replace(/\/$/, '')
    };
  } catch {
    return { host: url.toLowerCase(), path: '' };
  }
}

function fallbackCategory(url) {
  const { host, path } = getUrlParts(url);
  const target = `${host} ${path}`;
  if (/(game|play|toy|alchemy|guessr|seterra|puzzle|chess)/i.test(target)) return 'games';
  if (/(psych|mind|mental|therapy|therapist|counsel|nimh|mhanational|helpguide|wellbeing|emotion|yoga)/i.test(target)) return 'mental-health';
  if (/(code|coding|program|dev|stack|git|scratch|replit|glitch|microbit|blockly)/i.test(target)) return 'coding';
  if (/(art|design|photo|draw|sketch|figma|adobe|music|craft|comic|color|creative|behance|dribbble|awwwards|instructables)/i.test(target)) return 'creative';
  if (/(news|times|article|current-events|dogonews|snexplores|guardian|bbc|npr|apnews|dw\.com|cbc)/i.test(target)) return 'news';
  if (/(book|read|library|story|lit|poem|poetry|literacy)/i.test(target)) return 'reading';
  if (/(google|bing|duckduckgo|search|yahoo|yandex)/i.test(target)) return 'search';
  if (/(wikipedia|dictionary|thesaurus|reference|archive|britannica)/i.test(target)) return 'reference';
  if (/(microsoft|apple|github|mozilla|cloudflare|linux|developer|software|technology|tech|wired|verge|cnet|arstechnica)/i.test(target)) return 'technology';
  if (/(government|\.gov|parliament|congress|senate)/i.test(target)) return 'government';
  if (/(shop|store|amazon|ebay|etsy|walmart|target|retail|marketplace)/i.test(target)) return 'shopping';
  if (/(bank|paypal|visa|finance|financial|credit|money|market)/i.test(target)) return 'finance';
  if (/(travel|trip|hotel|flight|airline|booking|maps)/i.test(target)) return 'travel';
  if (/(medical|medicine|clinic|hospital|doctor|wellness)/i.test(target)) return 'health';
  if (/(tool|weather|speed|dropbox|zoom|slack|notion|openai|claude|calculator|dictionary|thesaurus|timer)/i.test(target)) return 'tools';
  if (/(learn|school|course|academy|edu|science|museum|archive|university|lesson|worksheet|math)/i.test(target)) return 'learning';
  return 'business';
}

function categoryFromResearch(url, name, description) {
  const target = `${url} ${name} ${description}`;
  if (/(mental health|mental illness|wellness|anxiety|depression|therapy|psychology|counseling|wellbeing)/i.test(target)) return 'mental-health';
  if (/(breaking news|journalism|headlines|world news|latest news|newspaper|broadcaster|opinion)/i.test(target)) return 'news';
  if (/(technology|software|startup|gadget|cybersecurity|computing|developer|artificial intelligence|tech)/i.test(target)) return 'technology';
  if (/(creative|design|designer|illustration|photography|art|maker|craft|portfolio|web design)/i.test(target)) return 'creative';
  if (/(course|learn|education|academy|lesson|school|training)/i.test(target)) return 'learning';
  if (/(dictionary|encyclopedia|reference|library|archive)/i.test(target)) return 'reference';
  if (/(book|ebook|reading|audiobook)/i.test(target)) return 'reading';
  if (/(finance|money|invest|insurance|bank|budget)/i.test(target)) return 'finance';
  return categoryFor(url);
}

function categoryFor(url) {
  const { host } = getUrlParts(url);
  return HOST_CATEGORIES[host] || fallbackCategory(url);
}

function categoryLabel(id) {
  return CATEGORIES.find(category => category.id === id)?.label || 'Research';
}

function fallbackDescription(url, name, category) {
  const label = categoryLabel(category).toLowerCase();
  const article = /^[aeiou]/i.test(label) ? 'an' : 'a';
  return `${name || displayName(url)} is ${article} ${label} resource.`;
}

function displayName(url) {
  const { host, path } = getUrlParts(url);
  const shortPath = path && path !== '/' ? path.replace(/^\//, '') : '';
  return shortPath ? `${host}/${shortPath}` : host;
}

function nameFromTitle(title, url) {
  const cleaned = cleanText(title)
    .replace(/\s+[-|:]\s+home$/i, '')
    .replace(/^home\s+[-|:]\s+/i, '');

  if (!cleaned) return displayName(url);

  const parts = cleaned.split(/\s+(?:[|·•-]|–|—)\s+/).map(cleanText).filter(Boolean);
  const host = getUrlParts(url).host.replace(/\.(com|org|net|gov|co|io|ai|edu|co\.za)$/i, '');
  const matchingPart = parts.find(part => part.toLowerCase().includes(host.toLowerCase()));
  return shortenText(matchingPart || parts[0] || cleaned, 56);
}

function faviconUrl(url) {
  const { host } = getUrlParts(url);
  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
}

function normalizeEntry(entry, index = 0) {
  const url = cleanUrl(entry.url);
  const name = cleanText(entry.name) || displayName(url);
  const category = entry.category || categoryFor(url);
  const description = cleanText(entry.description) || fallbackDescription(url, name, category);

  return {
    _id: entry._id,
    url,
    index,
    name,
    category,
    description,
    isFavorite: entry.isFavorite || false
  };
}

async function setBaseUrls(source) {
  urlItems = source.map((entry, index) => normalizeEntry(entry, index + 1));
  render();
}

function render() {
  renderCategoryButtons();

  const grid = document.getElementById('grid');
  const items = filteredItems();
  grid.innerHTML = '';

  document.getElementById('status').textContent = `${items.length} of ${urlItems.length} URLs (from MongoDB)`;
  document.getElementById('focusBtn').classList.toggle('active', focusMode);

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No URLs match the current filters.';
    grid.appendChild(empty);
    return;
  }

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const star = document.createElement('button');
    star.type = 'button';
    star.className = 'star';
    star.title = item.isFavorite ? 'Remove favorite' : 'Add favorite';
    star.textContent = item.isFavorite ? '★' : '☆';
    star.addEventListener('click', async () => {
      try {
        const updated = await saveWebsiteToDatabase({
          ...item,
          isFavorite: !item.isFavorite
        });
        item.isFavorite = updated.isFavorite;
        setDatabaseStatus(`${item.name} favorite status updated.`);
        render();
      } catch (error) {
        setDatabaseStatus(`Error updating favorite: ${error.message}`);
      }
    });

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'delete';
    remove.title = 'Delete website';
    remove.textContent = '×';
    remove.addEventListener('click', async () => {
      if (!confirm(`Delete ${item.name} from the website list?`)) return;

      try {
        await deleteWebsiteFromDatabase(item._id);
        urlItems = urlItems.filter(x => x._id !== item._id);
        setDatabaseStatus(`${item.name} was removed from MongoDB.`);
        render();
      } catch (error) {
        setDatabaseStatus(`Error deleting website: ${error.message}`);
      }
    });

    actions.appendChild(star);
    actions.appendChild(remove);

    const top = document.createElement('div');
    top.className = 'card-top';

    const index = document.createElement('div');
    index.className = 'index';
    index.textContent = item.index;

    const image = document.createElement('img');
    image.src = faviconUrl(item.url);
    image.alt = '';
    image.loading = 'lazy';

    top.appendChild(index);
    top.appendChild(image);

    const link = document.createElement('a');
    link.className = 'link';
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = item.name;
    link.title = item.url;

    const category = document.createElement('select');
    category.className = 'category-select';
    category.title = 'Move to category';
    category.setAttribute('aria-label', `Move ${item.name} to category`);

    for (const optionCategory of EDITABLE_CATEGORIES) {
      const option = document.createElement('option');
      option.value = optionCategory.id;
      option.textContent = optionCategory.label;
      category.appendChild(option);
    }

    category.value = item.category;
    category.addEventListener('change', async (event) => {
      const categoryId = normalizeCategory(event.target.value);
      if (!EDITABLE_CATEGORIES.some(entry => entry.id === categoryId) || categoryId === item.category) {
        category.value = item.category;
        return;
      }

      try {
        const updated = await saveWebsiteToDatabase({
          ...item,
          category: categoryId
        });
        item.category = updated.category;
        setDatabaseStatus(`${item.name} was moved to ${categoryLabel(categoryId)}.`);
        if (current !== 'all' && current !== 'fav') current = categoryId;
        render();
      } catch (error) {
        setDatabaseStatus(`Error updating category: ${error.message}`);
        category.value = item.category;
      }
    });

    const description = document.createElement('p');
    description.className = 'description';
    description.textContent = item.description;

    card.appendChild(actions);
    card.appendChild(top);
    card.appendChild(link);
    card.appendChild(category);
    if (item.description) card.appendChild(description);
    grid.appendChild(card);
  }
}

function setDatabaseStatus(message) {
  document.getElementById('databaseStatus').textContent = message || '';
}

function categoryCounts() {
  const counts = Object.fromEntries(CATEGORIES.map(category => [category.id, 0]));
  counts.all = urlItems.length;
  counts.fav = urlItems.filter(item => item.isFavorite).length;
  for (const item of urlItems) {
    counts[item.category] = (counts[item.category] || 0) + 1;
  }
  return counts;
}

function renderCategoryButtons() {
  const counts = categoryCounts();
  const container = document.getElementById('categoryButtons');
  container.innerHTML = '';

  for (const category of CATEGORIES) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = category.id === current ? 'active' : '';
    button.textContent = `${category.label} (${counts[category.id] || 0})`;
    button.addEventListener('click', () => {
      current = category.id;
      render();
    });
    container.appendChild(button);
  }
}

function filteredItems() {
  const query = document.getElementById('search').value.trim().toLowerCase();

  return urlItems.filter(item => {
    if (current === 'fav' && !item.isFavorite) return false;
    if (current !== 'all' && current !== 'fav' && item.category !== current) return false;
    if (focusMode && item.category === 'games') return false;
    if (!query) return true;

    const label = categoryLabel(item.category).toLowerCase();
    return item.name.toLowerCase().includes(query)
      || item.url.toLowerCase().includes(query)
      || item.description.toLowerCase().includes(query)
      || label.includes(query);
  });
}

const CSV_COLUMNS = ['url', 'name', 'category', 'description', 'isFavorite'];

function timestampSlug() {
  return new Date().toISOString().replace(/[:.]/g, '-');
}

function downloadText(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function csvEscape(value) {
  const text = String(value ?? '');
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function exportData() {
  const payload = {
    exported: new Date().toISOString(),
    websites: urlItems
  };
  downloadText(
    `safe-internet-data-${timestampSlug()}.json`,
    JSON.stringify(payload, null, 2),
    'application/json;charset=utf-8'
  );
  setDatabaseStatus('Exported JSON backup from MongoDB.');
}

function exportCsvData() {
  const rows = [
    CSV_COLUMNS,
    ...urlItems.map(item => [
      item.url,
      item.name,
      categoryLabel(item.category),
      item.description,
      item.isFavorite ? 'yes' : 'no'
    ])
  ];
  const csv = rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
  downloadText(`safe-internet-list-${timestampSlug()}.csv`, csv, 'text/csv;charset=utf-8');
  setDatabaseStatus(`Exported ${urlItems.length} websites to CSV.`);
}

function parseFavorite(value) {
  if (typeof value === 'boolean') return value;
  return /^(1|true|yes|y|starred|favorite|favourite)$/i.test(String(value || '').trim());
}

function parseCsvRows(text) {
  const rows = [];
  let row = [];
  let value = '';
  let quoted = false;

  for (let i = 0; i < text.length; i += 1) {
    const char = text[i];
    const next = text[i + 1];

    if (quoted) {
      if (char === '"' && next === '"') {
        value += '"';
        i += 1;
      } else if (char === '"') {
        quoted = false;
      } else {
        value += char;
      }
      continue;
    }

    if (char === '"') {
      quoted = true;
    } else if (char === ',') {
      row.push(value);
      value = '';
    } else if (char === '\n') {
      row.push(value);
      rows.push(row);
      row = [];
      value = '';
    } else if (char !== '\r') {
      value += char;
    }
  }

  row.push(value);
  rows.push(row);
  return rows.filter(entry => entry.some(cell => cleanText(cell)));
}

function normalizeHeader(value) {
  return String(value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
}

function csvHasHeader(row) {
  const headers = row.map(normalizeHeader);
  return headers.some(header => ['url', 'website', 'link'].includes(header))
    && headers.some(header => ['name', 'title', 'description', 'category', 'type'].includes(header));
}

function csvEntryFromRow(row, headers) {
  if (!headers) {
    return {
      url: row[0],
      name: row[1],
      category: row[2],
      description: row[3],
      isFavorite: row[4]
    };
  }

  const data = {};
  headers.forEach((header, index) => {
    data[header] = row[index];
  });

  return {
    url: data.url || data.website || data.link,
    name: data.name || data.title,
    category: data.category || data.type,
    description: data.description || data.summary,
    isFavorite: data.isfavorite || data.favorite || data.favourite || data.starred
  };
}

function entriesFromCsv(text) {
  const rows = parseCsvRows(text);
  if (!rows.length) return [];

  const hasHeader = csvHasHeader(rows[0]);
  const headers = hasHeader ? rows.shift().map(normalizeHeader) : null;
  return rows.map(row => csvEntryFromRow(row, headers));
}

function entriesFromJson(text) {
  const parsed = JSON.parse(text);
  if (Array.isArray(parsed)) return parsed;
  if (Array.isArray(parsed.websites)) return parsed.websites;
  if (Array.isArray(parsed.urls)) {
    return parsed.urls.map(entry => typeof entry === 'string' ? { url: entry } : entry);
  }
  throw new Error('JSON must be an array or contain a websites array.');
}

function importedUrlFromEntry(entry) {
  const raw = entry.url || entry.URL || entry.Url || entry.website || entry.Website || entry.link || entry.Link;
  if (raw) return normalizeInputUrl(raw);

  const domain = entry.domain || entry.Domain;
  return domain ? normalizeInputUrl(domain) : '';
}

function normalizeImportedEntry(entry) {
  const url = importedUrlFromEntry(entry);
  if (!url) return null;

  const category = normalizeCategory(entry.category || entry.Category || entry.type || entry.Type)
    || categoryFor(url);
  const name = cleanText(entry.name || entry.Name || entry.title || entry.Title || entry.Domain)
    || displayName(url);
  const description = cleanText(entry.description || entry.Description || entry.summary || entry.Summary)
    || fallbackDescription(url, name, category);

  return {
    url,
    name,
    category,
    description,
    isFavorite: parseFavorite(entry.isFavorite ?? entry.favorite ?? entry.Favorite ?? entry.favourite ?? entry.starred)
  };
}

function entriesFromImportFile(file, text) {
  const lowerName = file.name.toLowerCase();
  const trimmed = text.trim();

  if (lowerName.endsWith('.csv')) return entriesFromCsv(text);
  if (lowerName.endsWith('.json')) return entriesFromJson(text);
  if (trimmed.startsWith('{') || trimmed.startsWith('[')) return entriesFromJson(text);
  return entriesFromCsv(text);
}

async function importDataFromFile(file) {
  if (!file) return;

  const importButton = document.getElementById('importBtn');
  importButton.disabled = true;
  setDatabaseStatus('Checking MongoDB connection...');

  try {
    if (!await ensureMongoConnection()) return;

    setDatabaseStatus(`Reading ${file.name}...`);
    const text = await file.text();
    const rawEntries = entriesFromImportFile(file, text);
    const normalizedEntries = rawEntries.map(normalizeImportedEntry).filter(Boolean);

    const seen = new Set(urlItems.map(item => item.url));
    const imported = [];
    let skipped = rawEntries.length - normalizedEntries.length;

    for (const entry of normalizedEntries) {
      if (seen.has(entry.url)) {
        skipped += 1;
        continue;
      }

      const saved = await saveWebsiteToDatabase(entry);
      const normalized = normalizeEntry(saved, urlItems.length + imported.length + 1);
      imported.push(normalized);
      seen.add(normalized.url);
      setDatabaseStatus(`Imported ${imported.length} of ${normalizedEntries.length} websites...`);
    }

    urlItems.push(...imported);
    if (imported.length) current = 'all';
    render();

    const skippedText = skipped ? ` ${skipped} skipped.` : '';
    setDatabaseStatus(`Imported ${imported.length} websites from ${file.name}.${skippedText}`);
  } catch (error) {
    console.error('Import failed:', error);
    setDatabaseStatus(`Import failed: ${error.message}`);
  } finally {
    importButton.disabled = false;
  }
}

async function addWebsite() {
  const urlInput = document.getElementById('siteUrl');
  const nameInput = document.getElementById('siteName');
  const descriptionInput = document.getElementById('siteDescription');
  const url = normalizeInputUrl(urlInput.value);
  if (!url) {
    setDatabaseStatus('Enter a valid website URL.');
    return;
  }

  if (urlItems.some(item => item.url === url)) {
    setDatabaseStatus('That website is already in the list.');
    return;
  }

  if (!await ensureMongoConnection()) return;

  document.getElementById('addSiteBtn').disabled = true;
  setDatabaseStatus('Researching website page...');

  try {
    const manualName = cleanText(nameInput.value);
    const manualDescription = cleanText(descriptionInput.value);
    let researched = {};

    try {
      researched = await researchWebsiteMetadata(url);
    } catch (error) {
      console.warn('Website research failed, using fallback metadata:', error);
      setDatabaseStatus(`Could not research page metadata: ${error.message}. Using fallback details.`);
    }

    const researchedUrl = normalizeInputUrl(researched.url) || url;
    if (researchedUrl !== url && urlItems.some(item => item.url === researchedUrl)) {
      setDatabaseStatus('That website is already in the list.');
      return;
    }

    const researchedName = cleanText(researched.name);
    const researchedDescription = cleanText(researched.description);
    const name = manualName || researchedName || displayName(researchedUrl);
    let category = categoryFromResearch(researchedUrl, name, researchedDescription);
    const description = manualDescription || researchedDescription || fallbackDescription(researchedUrl, name, category);
    category = categoryFromResearch(researchedUrl, name, description);

    const item = normalizeEntry({
      url: researchedUrl,
      name,
      category,
      description,
      isFavorite: false
    });

    const saved = await saveWebsiteToDatabase(item);
    urlItems.push(normalizeEntry(saved, urlItems.length + 1));
    urlInput.value = '';
    nameInput.value = '';
    descriptionInput.value = '';
    current = saved.category;
    setDatabaseStatus(`${saved.name} was added to MongoDB with ${researched.description ? researched.source : 'fallback'} details.`);
    render();
  } catch (error) {
    setDatabaseStatus(`Could not add website: ${error.message}`);
  } finally {
    document.getElementById('addSiteBtn').disabled = false;
  }
}

// Auth and Security Panel implementation
let isSetupMode = false;
let currentPasscodeAttempt = '';
let currentConfirmAttempt = '';
let enteringConfirm = false;
let passwordVisible = false;

function resetAuthInputs() {
  currentPasscodeAttempt = '';
  currentConfirmAttempt = '';
  enteringConfirm = false;
  document.getElementById('passcode-input').value = '';
  document.getElementById('confirm-passcode-input').value = '';
  document.getElementById('confirm-passcode-group').style.display = 'none';
  document.getElementById('auth-error').textContent = '';
}

function renderMaskedInputs() {
  const mainInput = document.getElementById('passcode-input');
  const confirmInput = document.getElementById('confirm-passcode-input');
  
  if (passwordVisible) {
    mainInput.value = currentPasscodeAttempt;
    confirmInput.value = currentConfirmAttempt;
  } else {
    mainInput.value = '•'.repeat(currentPasscodeAttempt.length);
    confirmInput.value = '•'.repeat(currentConfirmAttempt.length);
  }
}

function handleKeypadPress(val) {
  if (enteringConfirm) {
    if (currentConfirmAttempt.length < 12) {
      currentConfirmAttempt += val;
    }
  } else {
    if (currentPasscodeAttempt.length < 12) {
      currentPasscodeAttempt += val;
    }
  }
  renderMaskedInputs();
}

function handleKeypadBackspace() {
  if (enteringConfirm) {
    if (currentConfirmAttempt.length > 0) {
      currentConfirmAttempt = currentConfirmAttempt.slice(0, -1);
    } else {
      enteringConfirm = false;
      document.getElementById('confirm-passcode-group').style.display = 'none';
      document.getElementById('auth-submit-btn').textContent = 'Set Passcode';
      document.getElementById('auth-subtitle').textContent = 'Set up a passcode to secure this site';
      showAuthError('');
    }
  } else {
    if (currentPasscodeAttempt.length > 0) {
      currentPasscodeAttempt = currentPasscodeAttempt.slice(0, -1);
    }
  }
  renderMaskedInputs();
}

function showAuthError(msg) {
  const errDiv = document.getElementById('auth-error');
  errDiv.textContent = msg;
  if (msg) {
    const card = document.querySelector('.auth-card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);
  }
}

async function submitAuth() {
  showAuthError('');
  
  if (isSetupMode) {
    if (currentPasscodeAttempt.length < 4) {
      showAuthError('Passcode must be at least 4 characters.');
      return;
    }
    
    if (!enteringConfirm) {
      enteringConfirm = true;
      document.getElementById('confirm-passcode-group').style.display = 'flex';
      document.getElementById('auth-submit-btn').textContent = 'Confirm & Set';
      document.getElementById('auth-subtitle').textContent = 'Confirm your secure passcode';
      renderMaskedInputs();
      return;
    }
    
    if (currentPasscodeAttempt !== currentConfirmAttempt) {
      showAuthError('Passcodes do not match. Try again.');
      resetAuthInputs();
      enteringConfirm = false;
      document.getElementById('auth-submit-btn').textContent = 'Set Passcode';
      document.getElementById('auth-subtitle').textContent = 'Set up a passcode to secure this site';
      return;
    }
    
    try {
      const response = await fetch('/api/auth/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode: currentPasscodeAttempt })
      });
      const data = await response.json();
      
      if (!response.ok) {
        showAuthError(data.error || 'Setup failed.');
        return;
      }
      
      sessionStorage.setItem('auth_token', data.token);
      checkAuthStatus();
    } catch (err) {
      showAuthError('Setup request failed. Check server.');
    }
  } else {
    if (currentPasscodeAttempt.length < 4) {
      showAuthError('Passcode must be at least 4 characters.');
      return;
    }
    
    const rememberMe = document.getElementById('remember-me-checkbox').checked;
    
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode: currentPasscodeAttempt, rememberMe })
      });
      const data = await response.json();
      
      if (!response.ok) {
        showAuthError(data.error || 'Incorrect passcode.');
        currentPasscodeAttempt = '';
        renderMaskedInputs();
        return;
      }
      
      if (rememberMe) {
        localStorage.setItem('auth_token', data.token);
      } else {
        sessionStorage.setItem('auth_token', data.token);
      }
      
      const lockIcon = document.getElementById('lock-icon');
      lockIcon.style.transform = 'rotate(-15deg) scale(1.1)';
      setTimeout(() => {
        checkAuthStatus();
      }, 300);
    } catch (err) {
      showAuthError('Authentication request failed.');
    }
  }
}

async function lockSession() {
  try {
    await fetch('/api/auth/logout', {
      method: 'POST',
      headers: getAuthHeaders()
    });
  } catch (err) {
    console.warn('Logout endpoint request failed:', err);
  }
  handleUnauthorized();
}

async function initApp() {
  try {
    const status = await waitForMongoConnection();

    if (status.status !== 'connected') {
      document.getElementById('status').textContent = 'MongoDB connection failed.';
      setDatabaseStatus(status.message || 'MongoDB is not accessible. Check server console.');
      return;
    }

    const websites = await loadWebsitesFromDatabase();
    if (websites.length) {
      await setBaseUrls(websites);
    } else {
      setDatabaseStatus('No websites found in MongoDB. Start adding them or import from CSV/JSON!');
    }
  } catch (error) {
    console.error('Dashboard initialization error:', error);
    document.getElementById('status').innerHTML = '⚠️ Connection error. Check console.';
    setDatabaseStatus('Failed to load from MongoDB. Try importing CSV/JSON.');
  }
}

async function checkAuthStatus() {
  try {
    const response = await fetch('/api/auth/status', { headers: getAuthHeaders() });
    if (!response.ok) throw new Error('Status request failed');
    const data = await response.json();

    if (!data.isSet) {
      isSetupMode = true;
      enteringConfirm = false;
      resetAuthInputs();
      document.getElementById('auth-title').textContent = 'Create Security Passcode';
      document.getElementById('auth-subtitle').textContent = 'Set up a passcode to secure this site (min 4 chars)';
      document.getElementById('remember-me-container').style.display = 'none';
      document.getElementById('auth-submit-btn').textContent = 'Set Passcode';
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    } else if (!data.isAuthenticated) {
      isSetupMode = false;
      enteringConfirm = false;
      resetAuthInputs();
      document.getElementById('auth-title').textContent = 'Safe Internet App Locked';
      document.getElementById('auth-subtitle').textContent = 'Enter passcode to access websites';
      document.getElementById('remember-me-container').style.display = 'flex';
      document.getElementById('auth-submit-btn').textContent = 'Unlock';
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    } else {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      if (urlItems.length === 0) {
        await initApp();
      }
    }
  } catch (error) {
    console.error('Failed to verify auth status:', error);
    showAuthError('Connection error. Is server running?');
  }
}

// Event Listeners for Lock screen
document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
  btn.addEventListener('click', () => {
    handleKeypadPress(btn.getAttribute('data-val'));
  });
});

document.getElementById('key-backspace').addEventListener('click', handleKeypadBackspace);
document.getElementById('key-clear').addEventListener('click', resetAuthInputs);
document.getElementById('auth-submit-btn').addEventListener('click', submitAuth);

document.getElementById('toggle-visibility').addEventListener('click', () => {
  passwordVisible = !passwordVisible;
  const mainInput = document.getElementById('passcode-input');
  const confirmInput = document.getElementById('confirm-passcode-input');
  const type = passwordVisible ? 'text' : 'password';
  mainInput.type = type;
  confirmInput.type = type;
  document.getElementById('toggle-visibility').textContent = passwordVisible ? '🙈' : '👁️';
  renderMaskedInputs();
});

// Keyboard support
document.addEventListener('keydown', event => {
  if (document.getElementById('auth-screen').style.display !== 'none') {
    if (event.key >= '0' && event.key <= '9') {
      handleKeypadPress(event.key);
    } else if (event.key === 'Backspace') {
      handleKeypadBackspace();
    } else if (event.key === 'Enter') {
      submitAuth();
    } else if (event.key === 'Escape') {
      resetAuthInputs();
    }
  }
});

// Lock button
document.getElementById('lockBtn').addEventListener('click', lockSession);

// Security Settings modal
document.getElementById('securityBtn').addEventListener('click', () => {
  document.getElementById('security-modal').style.display = 'flex';
  document.getElementById('change-error').textContent = '';
  document.getElementById('change-success').textContent = '';
  document.getElementById('change-passcode-form').reset();
});

document.getElementById('closeSecurityModal').addEventListener('click', () => {
  document.getElementById('security-modal').style.display = 'none';
});

window.addEventListener('click', event => {
  const modal = document.getElementById('security-modal');
  if (event.target === modal) {
    modal.style.display = 'none';
  }
});

document.getElementById('change-passcode-form').addEventListener('submit', async event => {
  event.preventDefault();
  
  const currentPasscode = document.getElementById('current-passcode').value;
  const newPasscode = document.getElementById('new-passcode').value;
  const confirmNew = document.getElementById('confirm-new-passcode').value;
  
  const errorDiv = document.getElementById('change-error');
  const successDiv = document.getElementById('change-success');
  
  errorDiv.textContent = '';
  successDiv.textContent = '';
  
  if (newPasscode.length < 4) {
    errorDiv.textContent = 'New passcode must be at least 4 characters.';
    return;
  }
  
  if (newPasscode !== confirmNew) {
    errorDiv.textContent = 'New passcodes do not match.';
    return;
  }
  
  try {
    const response = await fetch('/api/auth/change', {
      method: 'POST',
      headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ currentPasscode, newPasscode })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      errorDiv.textContent = data.error || 'Failed to change passcode.';
      return;
    }
    
    successDiv.textContent = 'Passcode changed successfully!';
    document.getElementById('change-passcode-form').reset();
    
    setTimeout(() => {
      document.getElementById('security-modal').style.display = 'none';
    }, 1500);
  } catch (err) {
    errorDiv.textContent = 'Request failed. Check your server.';
  }
});

// Run auth check on load
checkAuthStatus();
})();
</script>

</body>
</html>
