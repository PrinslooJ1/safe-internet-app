<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Internet App</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101214;
  --panel: #1b2024;
  --panel-soft: #22272d;
  --line: #343b42;
  --text: #f5f7f8;
  --muted: #aeb8bf;
  --accent: #2f9e8f;
  --accent-strong: #37b6a5;
  --warn: #e7b654;
  --danger: #e86f6f;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 18px;
}

header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 14px;
}

h1 {
  font-size: clamp(1.35rem, 3vw, 2rem);
  margin: 0;
  letter-spacing: 0;
}

#status {
  color: var(--muted);
  font-size: 0.88rem;
  text-align: right;
}

#controls {
  display: grid;
  gap: 10px;
  margin-bottom: 14px;
}

.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

input {
  min-width: min(100%, 280px);
  flex: 1 1 220px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  outline: none;
}

input:focus {
  border-color: var(--accent-strong);
}

select.category-select {
  justify-self: start;
  max-width: 100%;
  min-height: 30px;
  padding: 3px 28px 3px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 0.74rem;
  cursor: pointer;
}

select.category-select:hover,
select.category-select:focus {
  border-color: var(--accent);
  color: var(--text);
}

#databaseStatus {
  flex: 1 1 220px;
  color: var(--muted);
  font-size: 0.84rem;
}

button {
  min-height: 36px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  border-color: var(--accent);
}

button.active {
  background: var(--accent);
  border-color: var(--accent-strong);
  color: #061513;
  font-weight: 700;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

.card {
  min-height: 168px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 8px;
  position: relative;
  display: grid;
  gap: 8px;
  align-content: start;
}

.card:hover {
  border-color: var(--accent);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 64px;
}

.card img {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
}

.index {
  color: var(--muted);
  font-size: 0.72rem;
}

.card-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 2px;
}

.star,
.delete {
  width: 28px;
  height: 28px;
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
}

.star { color: var(--warn); }

.delete {
  color: var(--muted);
  font-size: 1rem;
}

.delete:hover {
  color: var(--danger);
}

.link {
  color: var(--text);
  text-decoration: none;
  font-size: 0.95rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.link:hover {
  color: var(--accent-strong);
}

.category {
  justify-self: start;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 0.74rem;
}

.description {
  margin: 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.38;
}

.empty {
  color: var(--muted);
  padding: 20px 0;
}

@media (max-width: 640px) {
  body { padding: 12px; }
  header { display: block; }
  #status { text-align: left; margin-top: 6px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
}
</style>
</head>
<body>

<header>
  <h1>Safe Internet App</h1>
  <div id="status">Loading URLs...</div>
</header>

<div id="controls">
  <div class="control-row">
    <input id="search" placeholder="Search websites, descriptions, or types..." autocomplete="off">
    <button id="focusBtn" type="button">Focus</button>
    <button id="exportBtn" type="button">Export JSON</button>
    <button id="exportCsvBtn" type="button">Export CSV</button>
    <button id="importBtn" type="button">Import JSON/CSV</button>
    <input id="importFile" class="visually-hidden" type="file" accept=".json,.csv,application/json,text/csv">
  </div>
  <div class="control-row">
    <input id="siteUrl" placeholder="Add website URL..." autocomplete="off" inputmode="url">
    <button id="addSiteBtn" type="button">Add Website</button>
    <div id="databaseStatus"></div>
  </div>
  <div class="control-row" id="categoryButtons"></div>
</div>

<div class="grid" id="grid"></div>

<script src="urls.js"></script>
<script>
const FALLBACK_URLS = [
  { url: 'https://kids.nationalgeographic.com/', category: 'Research' },
  { url: 'https://pbskids.org/games', category: 'Games' },
  { url: 'https://www.mathsisfun.com/', category: 'Learning' },
  { url: 'https://www.storylineonline.net/', category: 'Reading' },
  { url: 'https://code.org/', category: 'Coding' }
];

const CATEGORIES = [
  { id: 'all', label: 'All' },
  { id: 'search', label: 'Search' },
  { id: 'research', label: 'Research' },
  { id: 'reference', label: 'Reference' },
  { id: 'learning', label: 'Learning' },
  { id: 'news', label: 'News' },
  { id: 'reading', label: 'Reading' },
  { id: 'coding', label: 'Coding' },
  { id: 'tools', label: 'Tools' },
  { id: 'technology', label: 'Technology' },
  { id: 'creative', label: 'Creative' },
  { id: 'games', label: 'Games' },
  { id: 'mental-health', label: 'Mental Health' },
  { id: 'health', label: 'Health' },
  { id: 'government', label: 'Government' },
  { id: 'shopping', label: 'Shopping' },
  { id: 'finance', label: 'Finance' },
  { id: 'travel', label: 'Travel' },
  { id: 'business', label: 'Business' },
  { id: 'fav', label: 'Favorites' }
];

const EDITABLE_CATEGORIES = CATEGORIES.filter(category => !['all', 'fav'].includes(category.id));
const HOST_CATEGORIES = {};
const DATABASE_KEY = 'safeInternetApp.database.v1';
const DELETED_URLS_KEY = 'safeInternetApp.deletedUrls.v1';
const FAVORITES_KEY = 'safeInternetApp.favorites.v1';

let baseItems = [];
let urlItems = [];
let current = 'all';
let focusMode = false;
let databaseItems = readDatabase();
let deletedUrls = readDeletedUrls();
let fav = readFavorites();

function readJsonArray(key) {
  try {
    const stored = JSON.parse(localStorage.getItem(key) || '[]');
    return Array.isArray(stored) ? stored : [];
  } catch {
    return [];
  }
}

function readFavorites() {
  const stored = readJsonArray(FAVORITES_KEY);
  const legacy = readJsonArray('fav');
  return [...new Set([...stored, ...legacy].map(cleanUrl).filter(Boolean))];
}

function saveFavorites() {
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(fav));
  localStorage.setItem('fav', JSON.stringify(fav));
}

function prepareServerPayload(item) {
  return {
    url: item.url,
    name: item.name,
    category: item.category,
    description: item.description,
    favorite: fav.includes(item.url)
  };
}

async function syncWebsiteWithServer(item) {
  try {
    await fetch('/api/websites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(prepareServerPayload(item))
    });
  } catch (error) {
    console.warn('Failed to sync website to server:', error);
  }
}

function readDatabase() {
  return parseUrlEntries(readJsonArray(DATABASE_KEY));
}

function saveDatabase() {
  localStorage.setItem(DATABASE_KEY, JSON.stringify(databaseItems));
}

function readDeletedUrls() {
  return [...new Set(readJsonArray(DELETED_URLS_KEY).map(cleanUrl).filter(Boolean))];
}

function saveDeletedUrls() {
  localStorage.setItem(DELETED_URLS_KEY, JSON.stringify(deletedUrls));
}

function cleanUrl(raw) {
  return String(raw || '').trim().replace(/\/$/, '');
}

function normalizeInputUrl(raw) {
  const value = String(raw || '').trim();
  if (!value) return '';
  const withProtocol = /^https?:\/\//i.test(value) ? value : `https://${value}`;

  try {
    const parsed = new URL(withProtocol);
    parsed.hash = '';
    return cleanUrl(parsed.href);
  } catch {
    return '';
  }
}

function cleanText(raw) {
  return String(raw || '').trim().replace(/\s+/g, ' ');
}

function stripHtml(raw) {
  return cleanText(String(raw || '')
    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' '));
}

function shortenText(raw, max = 150) {
  const text = cleanText(raw);
  if (text.length <= max) return text;
  return `${text.slice(0, max - 1).replace(/\s+\S*$/, '')}.`;
}

function normalizeCategory(value) {
  const id = String(value || '')
    .trim()
    .toLowerCase()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');

  return CATEGORIES.some(category => category.id === id) ? id : '';
}

function parseUrlLine(line) {
  const trimmed = String(line || '').trim();
  if (!trimmed || trimmed.startsWith('#')) return null;

  const parts = trimmed.split(/\s*\|\s*/);
  const [urlPart] = parts;
  const url = cleanUrl(urlPart);
  if (!/^https?:\/\//i.test(url)) return null;

  let name = '';
  let category = '';
  let description = '';

  if (parts.length >= 4) {
    name = parts[1];
    category = parts[2];
    description = parts.slice(3).join(' | ');
  } else if (parts.length === 3) {
    const secondCategory = normalizeCategory(parts[1]);
    const thirdCategory = normalizeCategory(parts[2]);
    if (secondCategory && !thirdCategory) {
      category = parts[1];
      description = parts[2];
    } else if (thirdCategory) {
      name = parts[1];
      category = parts[2];
    } else {
      name = parts[1];
      description = parts[2];
    }
  } else if (parts.length === 2) {
    if (normalizeCategory(parts[1])) {
      category = parts[1];
    } else {
      description = parts[1];
    }
  }

  return {
    url,
    name: cleanText(name),
    category: normalizeCategory(category),
    description: cleanText(description)
  };
}

function parseUrlEntries(source) {
  const seen = new Set();
  const rows = Array.isArray(source)
    ? source.map(item => {
        if (typeof item === 'string') return parseUrlLine(item);
        return {
          url: cleanUrl(item?.url),
          name: cleanText(item?.name),
          category: normalizeCategory(item?.category),
          description: cleanText(item?.description)
        };
      })
    : String(source || '').split(/\r?\n/).map(parseUrlLine);

  return rows.filter(entry => {
    if (!entry || !/^https?:\/\//i.test(entry.url) || seen.has(entry.url)) return false;
    seen.add(entry.url);
    return true;
  });
}

function getUrlParts(url) {
  try {
    const parsed = new URL(url);
    return {
      host: parsed.hostname.toLowerCase().replace(/^www\./, ''),
      path: parsed.pathname.replace(/\/$/, '')
    };
  } catch {
    return { host: url.toLowerCase(), path: '' };
  }
}

function fallbackCategory(url) {
  const { host, path } = getUrlParts(url);
  const target = `${host} ${path}`;
  if (/(game|play|toy|alchemy|guessr|seterra|puzzle|chess)/i.test(target)) return 'games';
  if (/(psych|mind|mental|therapy|therapist|counsel|nimh|mhanational|helpguide|wellbeing|emotion|yoga)/i.test(target)) return 'mental-health';
  if (/(code|coding|program|dev|stack|git|scratch|replit|glitch|microbit|blockly)/i.test(target)) return 'coding';
  if (/(art|design|photo|draw|sketch|figma|adobe|music|craft|comic|color|creative|behance|dribbble|awwwards|instructables)/i.test(target)) return 'creative';
  if (/(news|times|article|current-events|dogonews|snexplores|guardian|bbc|npr|apnews|dw\.com|cbc)/i.test(target)) return 'news';
  if (/(book|read|library|story|lit|poem|poetry|literacy)/i.test(target)) return 'reading';
  if (/(google|bing|duckduckgo|search|yahoo|yandex)/i.test(target)) return 'search';
  if (/(wikipedia|dictionary|thesaurus|reference|archive|britannica)/i.test(target)) return 'reference';
  if (/(microsoft|apple|github|mozilla|cloudflare|linux|developer|software|technology|tech|wired|verge|cnet|arstechnica)/i.test(target)) return 'technology';
  if (/(government|\.gov|parliament|congress|senate)/i.test(target)) return 'government';
  if (/(shop|store|amazon|ebay|etsy|walmart|target|retail|marketplace)/i.test(target)) return 'shopping';
  if (/(bank|paypal|visa|finance|financial|credit|money|market)/i.test(target)) return 'finance';
  if (/(travel|trip|hotel|flight|airline|booking|maps)/i.test(target)) return 'travel';
  if (/(medical|medicine|clinic|hospital|doctor|wellness)/i.test(target)) return 'health';
  if (/(tool|weather|speed|dropbox|zoom|slack|notion|openai|claude|calculator|dictionary|thesaurus|timer)/i.test(target)) return 'tools';
  if (/(learn|school|course|academy|edu|science|museum|archive|university|lesson|worksheet|math)/i.test(target)) return 'learning';
  return 'business';
}

function categoryFromResearch(url, name, description) {
  const target = `${url} ${name} ${description}`;
  if (/(mental health|mental illness|wellness|anxiety|depression|therapy|psychology|counseling|wellbeing)/i.test(target)) return 'mental-health';
  if (/(breaking news|journalism|headlines|world news|latest news|newspaper|broadcaster|opinion)/i.test(target)) return 'news';
  if (/(technology|software|startup|gadget|cybersecurity|computing|developer|artificial intelligence|tech)/i.test(target)) return 'technology';
  if (/(creative|design|designer|illustration|photography|art|maker|craft|portfolio|web design)/i.test(target)) return 'creative';
  if (/(course|learn|education|academy|lesson|school|training)/i.test(target)) return 'learning';
  if (/(dictionary|encyclopedia|reference|library|archive)/i.test(target)) return 'reference';
  if (/(book|ebook|reading|audiobook)/i.test(target)) return 'reading';
  if (/(finance|money|invest|insurance|bank|budget)/i.test(target)) return 'finance';
  return categoryFor(url);
}

function categoryFor(url) {
  const { host } = getUrlParts(url);
  return HOST_CATEGORIES[host] || fallbackCategory(url);
}

function categoryLabel(id) {
  return CATEGORIES.find(category => category.id === id)?.label || 'Research';
}

function fallbackDescription(url, name, category) {
  const label = categoryLabel(category).toLowerCase();
  const article = /^[aeiou]/i.test(label) ? 'an' : 'a';
  return `${name || displayName(url)} is ${article} ${label} resource added to the safe browsing database.`;
}

function displayName(url) {
  const { host, path } = getUrlParts(url);
  const shortPath = path && path !== '/' ? path.replace(/^\//, '') : '';
  return shortPath ? `${host}/${shortPath}` : host;
}

function nameFromTitle(title, url) {
  const cleaned = cleanText(title)
    .replace(/\s+[-|:]\s+home$/i, '')
    .replace(/^home\s+[-|:]\s+/i, '');

  if (!cleaned) return displayName(url);

  const parts = cleaned.split(/\s+(?:[|·•-]|–|—)\s+/).map(cleanText).filter(Boolean);
  const host = getUrlParts(url).host.replace(/\.(com|org|net|gov|co|io|ai|edu|co\.za)$/i, '');
  const matchingPart = parts.find(part => part.toLowerCase().includes(host.toLowerCase()));
  return shortenText(matchingPart || parts[0] || cleaned, 56);
}

function faviconUrl(url) {
  const { host } = getUrlParts(url);
  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
}

function normalizeEntry(entry, index = 0) {
  const url = cleanUrl(entry.url);
  const name = cleanText(entry.name) || displayName(url);
  const category = entry.category || categoryFor(url);
  const description = cleanText(entry.description) || fallbackDescription(url, name, category);

  return {
    url,
    index,
    name,
    category,
    description
  };
}

function setBaseUrls(source) {
  baseItems = parseUrlEntries(source).map((entry, index) => ({
    url: entry.url,
    index: index + 1,
    name: entry.name || displayName(entry.url),
    category: entry.category || categoryFor(entry.url),
    description: entry.description || ''
  }));
  rebuildItems();
}

function rebuildItems() {
  const deleted = new Set(deletedUrls);
  const byUrl = new Map();

  for (const item of baseItems) {
    if (!deleted.has(item.url)) byUrl.set(item.url, normalizeEntry(item));
  }

  for (const item of databaseItems) {
    if (!deleted.has(item.url)) byUrl.set(item.url, normalizeEntry(item));
  }

  urlItems = [...byUrl.values()].map((item, index) => ({
    ...item,
    index: index + 1
  }));

  render();
}

function upsertDatabaseItem(item) {
  const normalized = normalizeEntry(item);
  if (!normalized.url) return null;

  databaseItems = [
    ...databaseItems.filter(entry => entry.url !== normalized.url),
    normalized
  ];
  deletedUrls = deletedUrls.filter(url => url !== normalized.url);
  saveDatabase();
  saveDeletedUrls();
  return normalized;
}

function deleteWebsite(item) {
  if (!confirm(`Delete ${item.name} from the website list?`)) return;

  databaseItems = databaseItems.filter(entry => entry.url !== item.url);
  if (!deletedUrls.includes(item.url)) deletedUrls.push(item.url);
  fav = fav.filter(url => url !== item.url);

  saveDatabase();
  saveDeletedUrls();
  saveFavorites();
  setDatabaseStatus(`${item.name} was removed.`);
  rebuildItems();
}

function moveWebsiteToCategory(item, categoryId) {
  const category = normalizeCategory(categoryId);
  if (!EDITABLE_CATEGORIES.some(entry => entry.id === category) || category === item.category) return;

  const currentFallback = fallbackDescription(item.url, item.name, item.category);
  const description = item.description === currentFallback
    ? fallbackDescription(item.url, item.name, category)
    : item.description;
  const moved = upsertDatabaseItem({ ...item, category, description });
  if (!moved) return;

  if (current !== 'all' && current !== 'fav') current = category;
  setDatabaseStatus(`${moved.name} was moved to ${categoryLabel(category)} and saved to the database.`);
  rebuildItems();
}

function setDatabaseStatus(message) {
  document.getElementById('databaseStatus').textContent = message || '';
}

function categoryCounts() {
  const counts = Object.fromEntries(CATEGORIES.map(category => [category.id, 0]));
  counts.all = urlItems.length;
  counts.fav = urlItems.filter(item => fav.includes(item.url)).length;
  for (const item of urlItems) {
    counts[item.category] = (counts[item.category] || 0) + 1;
  }
  return counts;
}

function renderCategoryButtons() {
  const counts = categoryCounts();
  const container = document.getElementById('categoryButtons');
  container.innerHTML = '';

  for (const category of CATEGORIES) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = category.id === current ? 'active' : '';
    button.textContent = `${category.label} (${counts[category.id] || 0})`;
    button.addEventListener('click', () => {
      current = category.id;
      render();
    });
    container.appendChild(button);
  }
}

function filteredItems() {
  const query = document.getElementById('search').value.trim().toLowerCase();

  return urlItems.filter(item => {
    if (current === 'fav' && !fav.includes(item.url)) return false;
    if (current !== 'all' && current !== 'fav' && item.category !== current) return false;
    if (focusMode && item.category === 'games') return false;
    if (!query) return true;

    const label = categoryLabel(item.category).toLowerCase();
    return item.name.toLowerCase().includes(query)
      || item.url.toLowerCase().includes(query)
      || item.description.toLowerCase().includes(query)
      || label.includes(query);
  });
}

function render() {
  renderCategoryButtons();

  const grid = document.getElementById('grid');
  const items = filteredItems();
  grid.innerHTML = '';

  document.getElementById('status').textContent = `${items.length} of ${urlItems.length} URLs shown`;
  document.getElementById('focusBtn').classList.toggle('active', focusMode);

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No URLs match the current filters.';
    grid.appendChild(empty);
    return;
  }

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const star = document.createElement('button');
    star.type = 'button';
    star.className = 'star';
    star.title = fav.includes(item.url) ? 'Remove favorite' : 'Add favorite';
    star.textContent = fav.includes(item.url) ? '★' : '☆';
    star.addEventListener('click', () => {
      const shouldAdd = !fav.includes(item.url);
      fav = shouldAdd
        ? [...fav, item.url]
        : fav.filter(url => url !== item.url);
      if (shouldAdd) {
        upsertDatabaseItem(item);
        setDatabaseStatus(`${item.name} was saved to the reusable database.`);
      }
      saveFavorites();
      syncWebsiteWithServer({ ...item, favorite: shouldAdd });
      rebuildItems();
    });

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'delete';
    remove.title = 'Delete website';
    remove.textContent = '×';
    remove.addEventListener('click', () => deleteWebsite(item));

    actions.appendChild(star);
    actions.appendChild(remove);

    const top = document.createElement('div');
    top.className = 'card-top';

    const index = document.createElement('div');
    index.className = 'index';
    index.textContent = item.index;

    const image = document.createElement('img');
    image.src = faviconUrl(item.url);
    image.alt = '';
    image.loading = 'lazy';

    top.appendChild(index);
    top.appendChild(image);

    const link = document.createElement('a');
    link.className = 'link';
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = item.name;
    link.title = item.url;

    const category = document.createElement('select');
    category.className = 'category-select';
    category.title = 'Move to category';
    category.setAttribute('aria-label', `Move ${item.name} to category`);

    for (const optionCategory of EDITABLE_CATEGORIES) {
      const option = document.createElement('option');
      option.value = optionCategory.id;
      option.textContent = optionCategory.label;
      category.appendChild(option);
    }

    category.value = item.category;
    category.addEventListener('change', event => {
      moveWebsiteToCategory(item, event.target.value);
    });

    const description = document.createElement('p');
    description.className = 'description';
    description.textContent = item.description;

    card.appendChild(actions);
    card.appendChild(top);
    card.appendChild(link);
    card.appendChild(category);
    if (item.description) card.appendChild(description);
    grid.appendChild(card);
  }
}

const CSV_COLUMNS = ['url', 'name', 'category', 'description', 'favorite'];
const CSV_HEADER_ALIASES = {
  fav: 'favorite',
  favourite: 'favorite',
  link: 'url',
  notes: 'description',
  shortdescription: 'description',
  title: 'name',
  type: 'category',
  website: 'url',
  websitename: 'name',
  websiteurl: 'url'
};

function timestampSlug() {
  return new Date().toISOString().replace(/[:.]/g, '-');
}

function downloadText(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function csvEscape(value) {
  const text = String(value ?? '');
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function exportData() {
  const payload = {
    favorites: fav,
    database: databaseItems,
    deletedUrls
  };
  downloadText(
    `safe-internet-data-${timestampSlug()}.json`,
    JSON.stringify(payload, null, 2),
    'application/json;charset=utf-8'
  );
  setDatabaseStatus('Exported JSON backup.');
}

function exportCsvData() {
  const rows = [
    CSV_COLUMNS,
    ...urlItems.map(item => [
      item.url,
      item.name,
      categoryLabel(item.category),
      item.description,
      fav.includes(item.url) ? 'yes' : 'no'
    ])
  ];
  const csv = rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
  downloadText(`safe-internet-list-${timestampSlug()}.csv`, csv, 'text/csv;charset=utf-8');
  setDatabaseStatus(`Exported ${urlItems.length} websites to CSV.`);
}

function parseCsvRows(source) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  const text = String(source || '').replace(/^\ufeff/, '');

  for (let index = 0; index < text.length; index += 1) {
    const char = text[index];

    if (inQuotes) {
      if (char === '"') {
        if (text[index + 1] === '"') {
          cell += '"';
          index += 1;
        } else {
          inQuotes = false;
        }
      } else {
        cell += char;
      }
      continue;
    }

    if (char === '"') {
      inQuotes = true;
    } else if (char === ',') {
      row.push(cell);
      cell = '';
    } else if (char === '\r') {
      if (text[index + 1] === '\n') index += 1;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else if (char === '\n') {
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else {
      cell += char;
    }
  }

  row.push(cell);
  rows.push(row);
  return rows;
}

function canonicalCsvHeader(value) {
  const key = String(value || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '');

  return CSV_COLUMNS.includes(key) ? key : CSV_HEADER_ALIASES[key] || '';
}

function truthyCsvValue(value) {
  return /^(1|true|yes|y|favorite|favourite)$/i.test(cleanText(value));
}

function parseCsvImport(source) {
  const rows = parseCsvRows(source).filter(row => row.some(cell => cleanText(cell)));
  if (!rows.length) return { entries: [], favorites: [] };

  const headers = rows[0].map(canonicalCsvHeader);
  const hasHeader = headers.includes('url');
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const entries = [];
  const favorites = [];

  for (const row of dataRows) {
    const record = {};

    if (hasHeader) {
      headers.forEach((header, index) => {
        if (header) record[header] = row[index] || '';
      });
    } else {
      record.url = row[0] || '';
      record.name = row[1] || '';
      record.category = row[2] || '';
      record.description = row[3] || '';
      record.favorite = row[4] || '';
    }

    const url = normalizeInputUrl(record.url);
    if (!url) continue;

    entries.push({
      url,
      name: cleanText(record.name),
      category: normalizeCategory(record.category),
      description: cleanText(record.description)
    });

    if (truthyCsvValue(record.favorite)) favorites.push(url);
  }

  return {
    entries: parseUrlEntries(entries),
    favorites: [...new Set(favorites)]
  };
}

function mergeImportedEntries(entries) {
  const importedUrls = new Set(entries.map(entry => entry.url));
  const byUrl = new Map(databaseItems.map(entry => [entry.url, entry]));

  for (const entry of entries) {
    byUrl.set(entry.url, normalizeEntry(entry));
  }

  databaseItems = [...byUrl.values()];
  deletedUrls = deletedUrls.filter(url => !importedUrls.has(url));
  saveDatabase();
  saveDeletedUrls();
}

function importCsvData(text) {
  const imported = parseCsvImport(text);
  if (!imported.entries.length) throw new Error('No valid URL rows were found.');

  mergeImportedEntries(imported.entries);
  fav = [...new Set([...fav, ...imported.favorites])];
  saveFavorites();
  current = 'all';
  rebuildItems();
  setDatabaseStatus(`Imported ${imported.entries.length} websites from CSV.`);
}

function importJsonData(imported) {
  if (Array.isArray(imported)) {
    const hasEntryObjects = imported.some(item => item && typeof item === 'object' && 'url' in item);
    if (hasEntryObjects) {
      databaseItems = parseUrlEntries(imported).map(normalizeEntry);
    } else {
      fav = imported.map(cleanUrl).filter(url => /^https?:\/\//i.test(url));
    }
  } else {
    fav = Array.isArray(imported.favorites)
      ? imported.favorites.map(cleanUrl).filter(url => /^https?:\/\//i.test(url))
      : fav;
    databaseItems = parseUrlEntries(imported.database || imported.urls || imported.items || databaseItems).map(normalizeEntry);
    deletedUrls = Array.isArray(imported.deletedUrls)
      ? imported.deletedUrls.map(cleanUrl).filter(Boolean)
      : deletedUrls;
  }

  saveFavorites();
  saveDatabase();
  saveDeletedUrls();
  current = 'all';
  rebuildItems();
  setDatabaseStatus('Imported JSON data.');
}

function importData() {
  const input = document.getElementById('importFile');
  input.value = '';
  input.click();
}

async function handleImportFile(event) {
  const [file] = event.target.files || [];
  if (!file) return;

  try {
    const text = await file.text();
    const trimmed = text.trim();
    const name = file.name.toLowerCase();

    if (name.endsWith('.json') || /^[{\[]/.test(trimmed)) {
      importJsonData(JSON.parse(trimmed));
    } else {
      importCsvData(text);
    }
  } catch (error) {
    alert(`Could not import data: ${error.message}`);
  }
}

function extractMetaFromDocument(doc, names) {
  const wanted = new Set(names.map(name => name.toLowerCase()));
  const tags = doc.querySelectorAll('meta[name], meta[property], meta[itemprop]');

  for (const tag of tags) {
    const key = tag.getAttribute('name') || tag.getAttribute('property') || tag.getAttribute('itemprop') || '';
    if (!wanted.has(key.toLowerCase())) continue;
    const content = tag.getAttribute('content');
    if (content) return cleanText(content);
  }

  return '';
}

function metadataFromHtml(url, html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = cleanText(doc.querySelector('title')?.textContent || '');
  const name = extractMetaFromDocument(doc, ['application-name', 'apple-mobile-web-app-title', 'og:site_name', 'og:title']) || nameFromTitle(title, url);
  const description = extractMetaFromDocument(doc, ['description', 'og:description', 'twitter:description']);

  return {
    url,
    name,
    description: shortenText(description || stripHtml(doc.body?.textContent || ''), 170)
  };
}

function parseReaderMetadata(url, text) {
  const title = cleanText(text.match(/^Title:\s*(.+)$/im)?.[1] || '');
  const description = cleanText(text.match(/^Description:\s*(.+)$/im)?.[1] || '');
  const markdown = text.split(/Markdown Content:/i).slice(1).join(' ');
  const firstParagraph = cleanText(markdown.split(/\n{2,}/).find(block => cleanText(block).length > 60) || '');

  return {
    url,
    name: nameFromTitle(title, url),
    description: shortenText(description || firstParagraph, 170)
  };
}

async function fetchText(url) {
  const response = await fetch(url, { cache: 'no-store', redirect: 'follow' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.text();
}

async function researchWebsite(url) {
  const attempts = [
    async () => metadataFromHtml(url, await fetchText(url)),
    async () => parseReaderMetadata(url, await fetchText(`https://r.jina.ai/${url}`))
  ];

  for (const attempt of attempts) {
    try {
      const result = await attempt();
      if (result.name && result.description) {
        const category = categoryFromResearch(url, result.name, result.description);
        return normalizeEntry({ ...result, category });
      }
    } catch {
      // Try the next metadata source.
    }
  }

  const name = displayName(url);
  const category = categoryFor(url);
  return normalizeEntry({
    url,
    name,
    category,
    description: fallbackDescription(url, name, category)
  });
}

async function addWebsite() {
  const input = document.getElementById('siteUrl');
  const url = normalizeInputUrl(input.value);
  if (!url) {
    setDatabaseStatus('Enter a valid website URL.');
    return;
  }

  if (urlItems.some(item => item.url === url)) {
    setDatabaseStatus('That website is already in the list.');
    return;
  }

  document.getElementById('addSiteBtn').disabled = true;
  setDatabaseStatus('Researching website...');

  try {
    const item = await researchWebsite(url);
    upsertDatabaseItem(item);
    syncWebsiteWithServer(item);
    input.value = '';
    current = item.category;
    setDatabaseStatus(`${item.name} was added.`);
    rebuildItems();
  } catch (error) {
    setDatabaseStatus(`Could not add website: ${error.message}`);
  } finally {
    document.getElementById('addSiteBtn').disabled = false;
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('siteUrl').addEventListener('keydown', event => {
  if (event.key === 'Enter') addWebsite();
});
document.getElementById('addSiteBtn').addEventListener('click', addWebsite);
document.getElementById('focusBtn').addEventListener('click', () => {
  focusMode = !focusMode;
  render();
});
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('exportCsvBtn').addEventListener('click', exportCsvData);
document.getElementById('importBtn').addEventListener('click', importData);
document.getElementById('importFile').addEventListener('change', handleImportFile);

const generatedUrls = Array.isArray(window.SAFE_URLS) && window.SAFE_URLS.length
  ? window.SAFE_URLS
  : FALLBACK_URLS;

setBaseUrls(generatedUrls);

fetch('urls.txt', { cache: 'no-store' })
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(text => {
    const entries = parseUrlEntries(text);
    if (entries.length) setBaseUrls(entries);
  })
  .catch(error => {
    console.info('Using generated urls.js data because urls.txt could not be loaded.', error);
  });
</script>
